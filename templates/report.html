<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>收盘复盘 · 单文件报告</title>
  <style>
    :root {
      --paper: #FAF7F1; --card: #FFFDF9; --ink: #1B1A17; --ink2: #6F6A5E;
      --hairline: #E6E0D3; --up: #BE3226; --down: #177245; --flat: #8A857A;
      --tape: #15171C; --link: #2C4A7C;
      --serif: "Songti SC", "STSong", "SimSun", serif;
      --sans: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink);
           font: 14px/1.6 var(--sans); font-variant-numeric: tabular-nums; }
    #app { max-width: 1080px; margin: 0 auto; padding: 0 20px 32px; }

    /* ===== 报头 ===== */
    .masthead { display: flex; align-items: flex-end; justify-content: space-between;
                gap: 12px; flex-wrap: wrap; padding: 24px 0 14px; }
    .brand h1 { font: 700 28px/1.1 var(--serif); letter-spacing: .14em; margin: 0; }
    .brand .sub { display: block; color: var(--ink2); font-size: 12px; letter-spacing: .08em; margin-top: 6px; }
    .meta-right { color: var(--ink2); font-size: 12px; text-align: right; line-height: 1.5; }

    /* ===== 行情纸带（签名元素）===== */
    .tape { background: var(--tape); border-radius: 6px; margin-bottom: 16px; }
    .tape-viewport { overflow: hidden; }
    .tape-track { display: inline-flex; white-space: nowrap; will-change: transform;
                  animation: tapemove 42s linear infinite; }
    .tape:hover .tape-track { animation-play-state: paused; }
    .tape-set { display: inline-flex; }
    .ti { display: inline-flex; align-items: baseline; gap: 7px; padding: 9px 18px;
          font: 12px var(--mono); color: #E8E6E1; border-right: 1px solid rgba(255,255,255,.08); }
    .ti em { font-style: normal; color: #8A8F98; }
    .ti b { font-weight: 600; }
    .tape .up { color: #FF7A6E; } .tape .down { color: #4ADE80; }
    @keyframes tapemove { to { transform: translateX(-50%); } }

    /* ===== 通用卡片 / 手风琴（方向C）===== */
    .card { background: var(--card); border: 1px solid var(--hairline); border-radius: 6px;
            padding: 16px 18px; margin-bottom: 14px; }
    h2 { font: 600 16px/1.3 var(--serif); letter-spacing: .06em; margin: 0 0 12px;
         display: flex; align-items: baseline; gap: 10px; }
    h2 .tag { font: 400 11px var(--sans); color: var(--ink2); letter-spacing: 0; }
    .up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--flat); }
    .grid { display: grid; gap: 14px; }
    .cols-2 { grid-template-columns: 1fr 1fr; }
    .cols-3 { grid-template-columns: repeat(3, 1fr); }
    @media (max-width: 860px) { .cols-2, .cols-3 { grid-template-columns: 1fr; } }
    .state { padding: 64px 0; text-align: center; color: var(--ink2); font-size: 14px; }

    .module { margin-bottom: 14px; }
    .acc-header { width: 100%; text-align: left; background: var(--card); border: 1px solid var(--hairline);
                  border-radius: 6px; padding: 14px 16px; cursor: pointer; display: flex; align-items: center;
                  gap: 10px; font: inherit; color: var(--ink); transition: background 120ms ease-out; }
    .acc-header:active { background: #F3EEE2; }
    .module.open .acc-header { border-bottom: none; border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
    .acc-header .chev { color: var(--ink2); transition: transform .2s ease-out; font-size: 13px; }
    .module.open .acc-header .chev { transform: rotate(90deg); }
    .acc-header .htitle { font: 600 16px/1.3 var(--serif); letter-spacing: .06em; }
    .acc-header .hsum { margin-left: auto; font-size: 13px; color: var(--ink2); text-align: right; }
    .acc-body { max-height: 0; overflow: hidden; transition: max-height .35s ease-out; }
    .module.open .acc-body { max-height: 20000px; }
    .acc-body > .inner { padding: 16px 18px; background: var(--card);
                              border: 1px solid var(--hairline); border-top: none;
                              border-radius: 0 0 6px 6px; }
    .sub-title { font: 600 14px/1.3 var(--serif); letter-spacing: .05em; margin: 18px 0 10px; }
    .sub-title:first-child { margin-top: 0; }

    /* ===== 今日核心结论 hero（置顶、不固定）===== */
    .conclusion-hero { border-left: 3px solid var(--up); }
    .chead { display: flex; align-items: center; gap: 8px; font: 600 14px var(--serif);
             letter-spacing: .05em; margin-bottom: 8px; }
    .chead .ctag { margin-left: auto; font: 400 11px var(--sans); color: var(--ink2); letter-spacing: 0; }
    .conclusion { white-space: pre-line; line-height: 1.85; color: var(--ink); font-size: 13.5px; margin: 0; }

    /* ===== 市场情绪 Hero ===== */
    .hero-grid { display: grid; grid-template-columns: auto 1fr; gap: 26px; align-items: center; }
    @media (max-width: 640px) { .hero-grid { grid-template-columns: 1fr; gap: 14px; } }
    .giant { font: 700 64px/1 var(--serif); letter-spacing: -.02em; }
    .giant .pct { font-size: 28px; margin-left: 2px; }
    .giant-label { color: var(--ink2); font-size: 12px; letter-spacing: .1em; margin-top: 10px; }
    .big-bar { display: flex; height: 14px; border-radius: 3px; overflow: hidden; }
    .big-bar > div { display: flex; align-items: center; justify-content: center;
                     font: 10px var(--mono); color: #fff; min-width: 0; }
    .seg-up { background: var(--up); } .seg-flat { background: #CFC8B8; } .seg-down { background: var(--down); }
    .stat-row { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 10px; font-size: 13px; }
    .comment { margin: 10px 0 0; color: var(--ink2); font-size: 13px; }

    /* ===== 涨跌分档直方图 ===== */
    .hrow { display: flex; align-items: center; gap: 10px; padding: 2.5px 0; font-size: 12px; }
    .hlabel { width: 46px; flex: none; text-align: right; color: var(--ink2); }
    .hbar { flex: 1; height: 10px; background: #F0EBDF; border-radius: 2px; overflow: hidden; }
    .hbar i { display: block; height: 100%; }
    .hbar i.up { background: var(--up); } .hbar i.down { background: var(--down); } .hbar i.flat { background: #CFC8B8; }
    .hcount { width: 48px; flex: none; text-align: right; }

    /* ===== 键值行 ===== */
    .kv { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0;
          border-bottom: 1px dashed var(--hairline); font-size: 13px; }
    .kv:last-child { border-bottom: 0; }
    .kv .k { color: var(--ink2); flex: none; }
    .kv .v { text-align: right; }
    .kv.small { font-size: 12.5px; padding: 3px 0; }

    /* ===== 今日指数 ===== */
    .idx-name { color: var(--ink2); font-size: 12px; letter-spacing: .06em; }
    .idx-close { font: 700 26px/1.2 var(--serif); margin-top: 4px; }
    .idx-pct { font-size: 15px; font-weight: 600; }
    .idx-chgs { display: flex; flex-wrap: wrap; gap: 2px 14px; margin-top: 8px; font-size: 12px; color: var(--ink2); }
    .rbar { position: relative; height: 4px; background: #EFE9DC; border-radius: 2px; margin: 12px 0 4px; }
    .rbar i { position: absolute; top: 50%; left: 0; width: 8px; height: 8px; border-radius: 50%;
              background: var(--ink); transform: translate(-50%, -50%); }
    .rlabel { display: flex; justify-content: space-between; font: 10px var(--mono); color: var(--ink2); }
    .money-line { margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--hairline);
                  font-size: 13px; color: var(--ink2); }

    /* ===== 板块风向 ===== */
    .plate-title { font: 600 13px var(--serif); letter-spacing: .05em; margin-bottom: 6px; }
    .prow { display: grid; grid-template-columns: 18px 1fr auto auto; gap: 4px 10px; align-items: baseline;
            padding: 5px 0 4px; border-bottom: 1px dashed var(--hairline); font-size: 13px; }
    .prow:last-child { border-bottom: 0; }
    .rank { color: var(--ink2); font-size: 11px; }
    .plead { grid-column: 2 / -1; font-size: 11px; color: var(--ink2); }

    /* ===== 自选股 ===== */
    .stock { border: 1px solid var(--hairline); border-radius: 6px; padding: 14px 16px; background: #fff; }
    .stock-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
    .s-name { font-weight: 600; font-size: 16px; }
    .s-code { color: var(--ink2); font-size: 11px; margin-left: 6px; }
    .s-type { display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: 3px;
              font-size: 10px; line-height: 16px; vertical-align: 2px;
              background: #F0EBDF; color: var(--ink2); letter-spacing: .05em; }
    .s-price { display: flex; align-items: baseline; gap: 8px; }
    .big2 { font: 700 24px/1 var(--serif); }
    .s-range { margin-top: 8px; }
    .s-metrics { display: grid; grid-template-columns: 1fr 1fr; column-gap: 18px; margin-top: 8px; }
    .s-news { margin-top: 10px; }
    .news-title { font: 600 12px var(--serif); letter-spacing: .06em; color: var(--ink2); margin-bottom: 4px; }
    .s-news a, .notice { display: flex; justify-content: space-between; gap: 10px; padding: 3px 0;
                         font-size: 12.5px; border-bottom: 1px dashed var(--hairline); }
    .s-news a { color: var(--link); text-decoration: none; }
    .s-news a:hover { text-decoration: underline; }
    .notice { color: var(--ink); }
    .s-news a:last-child, .notice:last-child { border-bottom: 0; }
    .ntime { color: var(--ink2); font-size: 11px; flex: none; }

    footer { text-align: center; color: var(--ink2); font-size: 12px; padding: 16px 0 4px; }

    /* ===== 集群详情 ===== */
    .clusters { display: flex; flex-direction: column; gap: 7px; }
    .cluster-head { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
                    padding: 10px 13px; border: 1px solid var(--hairline); border-radius: 6px;
                    background: #fff; cursor: pointer; font: 14px var(--sans); color: var(--ink);
                    transition: background 120ms ease-out; }
    .cluster-head:hover { background: #F3EEE2; }
    .ctitle { font-weight: 600; }
    .cmeta { color: var(--ink2); font-size: 12px; }
    .caret { margin-left: auto; color: var(--ink2); transition: transform 160ms ease-out; }
    .caret.open { transform: rotate(90deg); }
    .cluster-body { display: none; padding: 2px 13px 8px; border: 1px solid var(--hairline); border-top: 0;
                    border-radius: 0 0 6px 6px; margin-top: -1px; }
    .cluster.open .cluster-body { display: block; }
    .inflow { font-family: var(--mono); }
  </style>
</head>
<body>
  <div id="app"></div>

  <!-- AI 每日将下面占位替换为当日 data/daily/YYYY-MM-DD.json 的内容 -->
  <script type="application/json" id="REVIEW_DATA">__REVIEW_DATA__</script>

  <script>
    const raw = document.getElementById("REVIEW_DATA").textContent.trim();
    // 注意：占位符用拼接避免被 build_report.py 的全局替换误注入到本行字符串里
    const SENTINEL = "__REVIEW" + "_DATA__";
    const data = (raw && raw.indexOf(SENTINEL) === -1) ? JSON.parse(raw) : null;

    const esc = s => (s == null ? "" : String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;" }[c])));
    const cls = v => { const n = Number(v); return n > 0 ? "up" : n < 0 ? "down" : "flat"; };
    const signed = v => { const n = Number(v); if (v == null || isNaN(n)) return "-"; return (n > 0 ? "+" : "") + n; };
    const fmt = v => (v == null ? "-" : v);
    const round1 = v => (v == null ? null : Math.round(v * 10) / 10);
    const fmtMoney = n => { if (n == null) return "-"; const yi = n / 1e8; return yi >= 1e4 ? (yi / 1e4).toFixed(2) + " 万亿" : yi.toFixed(0) + " 亿"; };
    const fmtSignedMoney = n => { if (n == null) return "-"; return (n > 0 ? "+" : n < 0 ? "-" : "") + fmtMoney(Math.abs(n)); };
    const fmtCap = fmtMoney;
    const fmtInflow = n => { if (n == null) return "-"; const yi = n / 1e4; return (yi > 0 ? "+" : "") + (Math.abs(yi) >= 1 ? yi.toFixed(1) + "亿" : n.toFixed(0) + "万"); };
    const typeLabel = t => ({ index: "指数", plate: "板块", us_index: "美股" }[t] || "");

    function metricsOf(type) {
      const f = (data.market.overview || []).find(x => x && x.type === type);
      const o = {};
      if (f && f.metrics) f.metrics.forEach(m => { o[m.key] = m.value; });
      return o;
    }
    function computeIndices() {
      const t = metricsOf("trade"), iv = metricsOf("interval");
      const wl = data.watchlist || [];
      const getWL = code => wl.find(s => s.code === code);
      const mk = (name, cp, cx, c5, c20, c60, c250, hi, lo) => ({
        name, close: cp, pct: cx, c5, c20, c60, c250, hi52: hi, lo52: lo,
        pos52: (cp != null && hi != null && lo != null && hi > lo)
          ? Math.min(100, Math.max(0, (cp - lo) / (hi - lo) * 100)) : null,
      });
      const sh = mk("上证指数", t.CLOSE_PRICE_SZZS, t.CHANGE_PCT_SZZS, iv.CHG_5D_SZZS, iv.CHG_20D_SZZS, iv.CHG_60D_SZZS, iv.CHG_250D_SZZS, iv["52WEEK_HIGH_SZZS"], iv["52WEEK_LOW_SZZS"]);
      const sz = mk("深证成指", t.CLOSE_PRICE_SZCZ, t.CHANGE_PCT_SZCZ, iv.CHG_5D_SZCZ, iv.CHG_20D_SZCZ, null, iv.CHG_250D_SZCZ, null, null);
      const cyb = mk("创业板指", t.CLOSE_PRICE_CYBZ, t.CHANGE_PCT_CYBZ, iv.CHG_5D_CYBZ, iv.CHG_20D_CYBZ, null, iv.CHG_250D_CYBZ, null, null);
      const hs = getWL("sh000300");
      const hsIdx = hs ? mk("沪深300", hs.quote.price, hs.quote.change_percent, hs.quote.chg_5d, hs.quote.chg_20d, hs.quote.chg_60d, hs.quote.chg_ytd, hs.quote.high_52week, hs.quote.low_52week) : null;
      const usList = wl.filter(s => s.type === "us_index");
      const usIdx = usList.map(us => mk(us.name, us.quote.price, us.quote.change_percent, us.quote.chg_5d, us.quote.chg_20d, us.quote.chg_60d, us.quote.chg_ytd, us.quote.high_52week, us.quote.low_52week));
      return [sh, sz, cyb, hsIdx, ...usIdx].filter(Boolean);
    }
    function sectorBlocks() {
      const s = data.market.sectors || {};
      return [
        { title: "领涨行业", list: s.leading_plates || [] },
        { title: "领跌行业", list: s.lagging_plates || [] },
        { title: "领涨概念", list: s.leading_concepts || [] },
        { title: "领跌概念", list: s.lagging_concepts || [] },
      ];
    }
    function summaryRows() {
      const f = (data.market.overview || []).find(x => x && x.type === "summary");
      if (!f || !f.metrics) return [];
      return f.metrics.map(m => {
        if (typeof m.value !== "string") return { key: m.key, label: m.label, kw: null, rest: m.value };
        const hit = m.value.match(/^([^(（]+)[(（](.*)$/);
        return hit ? { key: m.key, label: m.label, kw: hit[1], rest: "（" + hit[2] }
                    : { key: m.key, label: m.label, kw: null, rest: m.value };
      });
    }
    function pos52(st) {
      const q = st.quote;
      if (q.high_52week > q.low_52week) return Math.min(100, Math.max(0, (q.price - q.low_52week) / (q.high_52week - q.low_52week) * 100));
      return 0;
    }
    function tickerItems() {
      const ix = computeIndices().map(i => ({ name: i.name, price: i.close, chg: i.pct }));
      const wl = (data.watchlist || []).map(s => ({ name: s.name, price: s.quote.price, chg: s.quote.change_percent }));
      return [...ix, ...wl];
    }

    function idxCard(ix) {
      return `<div class="idx-card">
        <div class="idx-name">${esc(ix.name)}</div>
        <div class="idx-close">${fmt(ix.close)}</div>
        <div class="idx-pct ${cls(ix.pct)}">${signed(ix.pct)}%</div>
        ${ix.hi52 != null ? `<div class="rbar"><i style="left:${ix.pos52}%"></i></div>
          <div class="rlabel"><span>${ix.lo52}</span><span>52周</span><span>${ix.hi52}</span></div>` : ""}
        <div class="idx-chgs">
          <span>5日 <b class="${cls(ix.c5)}">${signed(ix.c5)}</b></span>
          <span>20日 <b class="${cls(ix.c20)}">${signed(ix.c20)}</b></span>
          ${ix.c60 != null ? `<span>60日 <b class="${cls(ix.c60)}">${signed(ix.c60)}</b></span>` : ""}
          <span>250日 <b class="${cls(ix.c250)}">${signed(ix.c250)}</b></span>
        </div>
      </div>`;
    }
    function rangeBar(q) {
      if (q.high_52week != null && q.low_52week != null)
        return `<div class="s-range"><div class="rbar"><i style="left:${pos52({ quote: q })}%"></i></div>
          <div class="rlabel"><span>${q.low_52week}</span><span>52周</span><span>${q.high_52week}</span></div></div>`;
      return "";
    }
    function kv(k, v, c) { return (v == null) ? "" : `<div class="kv small"><span class="k">${k}</span><span class="v ${c || ""}">${v}</span></div>`; }
    function stockCard(st) {
      const q = st.quote || {};
      const news = (st.news || []).length ? `<div class="s-news"><div class="news-title">新闻</div>${
        st.news.map(n => `<a href="${esc(n.url || "#")}" target="_blank" rel="noopener"><span>${esc(n.title)}</span><span class="ntime">${esc((n.time || "").slice(5, 16))}</span></a>`).join("")}</div>` : "";
      const notice = (st.notice || []).length ? `<div class="s-news"><div class="news-title">公告</div>${
        st.notice.map(n => `<div class="notice"><span>${esc(n.title)}</span><span class="ntime">${esc((n.time || "").slice(5, 10))}</span></div>`).join("")}</div>` : "";
      return `<article class="stock">
        <div class="stock-head">
          <div class="s-name">${esc(st.name)}<span class="s-code">${esc(st.code)}</span>${typeLabel(st.type) ? `<span class="s-type">${typeLabel(st.type)}</span>` : ""}</div>
          <div class="s-price"><span class="big2 ${cls(q.change_percent)}">${fmt(q.price)}</span><span class="${cls(q.change_percent)}">${signed(q.change_percent)}%</span></div>
        </div>
        ${rangeBar(q)}
        <div class="s-metrics">
          ${kv("换手率", q.turnover_rate != null ? q.turnover_rate + "%" : null)}
          ${kv("量比", q.volume_ratio != null ? q.volume_ratio : null)}
          ${kv("市盈率", q.pe_ratio != null ? q.pe_ratio : null)}
          ${kv("市净率", q.pb_ratio != null ? q.pb_ratio : null)}
          ${kv("5日", q.chg_5d != null ? signed(q.chg_5d) + "%" : null, cls(q.chg_5d))}
          ${kv("20日", q.chg_20d != null ? signed(q.chg_20d) + "%" : null, cls(q.chg_20d))}
          ${kv("60日", q.chg_60d != null ? signed(q.chg_60d) + "%" : null, cls(q.chg_60d))}
          ${kv("年初至今", q.chg_ytd != null ? signed(q.chg_ytd) + "%" : null, cls(q.chg_ytd))}
          ${kv("总市值", q.total_market_cap != null ? fmtCap(q.total_market_cap) : null)}
          ${kv("成交额", q.amount != null ? fmtMoney(q.amount) : null)}
        </div>
        ${news}${notice}
      </article>`;
    }

    function render() {
      const app = document.getElementById("app");
      if (!data) { app.innerHTML = '<div class="state">数据未填充：请用当日 JSON 替换 REVIEW_DATA 占位。</div>'; return; }
      const m = data.market, b = m.breadth || {}, s = m.sectors || {}, wl = data.watchlist || [];
      const t = metricsOf("trade");
      const indices = computeIndices();
      const sh = indices.find(i => i.name === "上证指数");
      const cyb = indices.find(i => i.name === "创业板指");
      const summaryLine = [sh ? "沪" + signed(sh.pct) + "%" : "", cyb ? "创业" + signed(cyb.pct) + "%" : "", "涨" + b.upCount + "/跌" + b.downCount].filter(Boolean).join(" · ");

      const tapeItems = tickerItems().map(it =>
        `<span class="ti"><em>${esc(it.name)}</em><b>${fmt(it.price)}</b><b class="${cls(it.chg)}">${signed(it.chg)}%</b></span>`).join("");

      const overviewBody = `<div class="hero-grid">
          <div>
            <div class="giant ${cls(b.upRatio - 50)}">${b.upRatio}<span class="pct">%</span></div>
            <div class="giant-label">上涨家数占比</div>
          </div>
          <div>
            <div class="big-bar">
              <div class="seg-up" style="flex:${b.upCount}">${b.upCount} 涨</div>
              <div class="seg-flat" style="flex:${b.flatCount}"></div>
              <div class="seg-down" style="flex:${b.downCount}">${b.downCount} 跌</div>
            </div>
            <div class="stat-row">
              <span>涨停 <b class="up">${b.upLimitCount}</b></span>
              <span>跌停 <b class="down">${b.downLimitCount}</b></span>
              <span>平盘 ${b.flatCount}</span>
              <span>停牌 ${b.suspensionCount != null ? b.suspensionCount : "—"}</span>
              <span>成交 ${fmtMoney(b.totalAmount)}（较上日 ${fmtSignedMoney(b.amountChange)}）</span>
            </div>
            <p class="comment">${esc(b.comment)}</p>
          </div>
        </div>

        <h3 class="sub-title">今日指数</h3>
        <div class="grid cols-3">${indices.map(idxCard).join("")}</div>
        <div class="money-line">
          两市成交额 ${fmtMoney((t.MONEY || 0) * 1e8)} ·
          较5日均 ${signed(round1(t.MONEY_5DAVG_RATIO - 100))}% ·
          较20日均 ${signed(round1(t.MONEY_20DAVG_RATIO - 100))}% ·
          较60日均 ${signed(round1(t.MONEY_60DAVG_RATIO - 100))}%
        </div>

        <h3 class="sub-title">涨跌分档与市场画像</h3>
        <div class="grid cols-2">
          <div>
            <div class="comment" style="margin:0 0 6px">涨跌分档（家数）</div>
            ${(b.detail && b.detail.length) ? b.detail.map(seg => `<div class="hrow"><span class="hlabel">${esc(seg.section)}</span><span class="hbar"><i class="${cls(seg.flag)}" style="width:${(seg.count / Math.max(1, ...(b.detail.map(x => x.count))) * 100).toFixed(1)}%"></i></span><span class="hcount ${cls(seg.flag)}">${seg.count}</span></div>`).join("") : '<p class="comment">该交易日为历史补做日，精细涨跌分档数据已不可回溯。</p>'}
          </div>
          <div>
            <div class="comment" style="margin:0 0 6px">市场画像（综合评分与状态）</div>
            ${summaryRows().map(r => `<div class="kv small"><span class="k">${esc(r.label)}</span><span class="v"><b class="${cls(r.kw)}">${esc(r.kw)}</b>${esc(r.rest)}</span></div>`).join("")}
          </div>
        </div>`;

      const sectorBody = `<div class="grid cols-2">${sectorBlocks().map(blk => `<div>
          <div class="plate-title">${esc(blk.title)}</div>
          ${blk.list.map((x, i) => `<div class="prow"><span class="rank">${i + 1}</span><span>${esc(x.name)}</span><span class="${cls(x.zdf)}">${signed(x.zdf)}%</span><span class="${cls(x.main_inflow)}">${fmtInflow(x.main_inflow)}</span><span class="plead">领涨 ${esc(x.lead_stock.name)} ${signed(x.lead_stock.zdf)}%</span></div>`).join("")}
        </div>`).join("")}</div>
        <p class="comment">板块涨跌幅为价格指数口径；主力净流入单位万元，展示已折算。</p>`;

      const clusterBody = `<div class="clusters">${m.clusters.map((c, ci) => `<div class="cluster" data-ci="${ci}">
          <button class="cluster-head" data-ci="${ci}"><span class="ctitle">${esc(c.name)}</span><span class="cmeta">${c.members.length} 个板块</span><span class="caret">▸</span></button>
          <div class="cluster-body">${c.members.map((mm, mi) => `<div class="prow"><span class="rank">${mi + 1}</span><span>${esc(mm.name)}</span><span class="${cls(mm.zdf)}">${signed(mm.zdf)}%</span><span class="${cls(mm.zljlr_yi)} inflow">${signed(mm.zljlr_yi)}亿</span><span class="plead">领涨 ${esc(mm.lead_stock)} ${signed(mm.lead_zdf)}%</span></div>`).join("")}</div>
        </div>`).join("")}</div>
        <p class="comment">资金簇 zdf 为板块涨跌幅%，zljlr 为主力净流入（亿元）；与板块价格指数口径的背离见今日结论。</p>`;

      const watchBody = `<div class="grid cols-2">${wl.map(stockCard).join("")}</div>`;

      const mod = (key, title, hsum, body, openByDefault) => `<section class="module${openByDefault ? " open" : ""}">
          <button class="acc-header" data-mod="${key}"><span class="chev">▸</span><span class="htitle">${title}</span><span class="hsum">${esc(hsum)}</span></button>
          <div class="acc-body"><div class="inner card">${body}</div></div>
        </section>`;

      const lp0 = (s.leading_plates || [])[0];
      const sectorSum = lp0 ? "领涨 " + lp0.name + " " + signed(lp0.zdf) + "%" : "";
      const clusterSum = (m.clusters && m.clusters.length) ? m.clusters[0].name : "";

      app.innerHTML = `
        <header class="masthead">
          <div class="brand"><h1>收盘复盘</h1><span class="sub">A股每日复盘 · 单文件报告</span></div>
          <div class="meta-right">交易日 ${esc(data.meta.date)}<br>来源 ${esc(data.meta.source)}${data.meta.generated_at ? " · 生成 " + esc(data.meta.generated_at) : ""}</div>
        </header>

        ${m.conclusion ? `<section class="card conclusion-hero"><div class="chead"><span>今日核心结论</span><span class="ctag">AI 复盘总结 · ${esc(data.meta.date)}</span></div><p class="conclusion">${esc(m.conclusion)}</p></section>` : ""}

        <div class="tape" aria-label="行情纸带"><div class="tape-viewport"><div class="tape-track">
          <span class="tape-set">${tapeItems}</span><span class="tape-set">${tapeItems}</span>
        </div></div></div>

        ${mod("overview", "大盘全景", summaryLine, overviewBody, true)}
        ${mod("sectors", "板块轮动", sectorSum, sectorBody, false)}
        ${mod("clusters", "资金簇", clusterSum, clusterBody, false)}
        ${mod("watchlist", "自选股", wl.length + " 只", watchBody, false)}

        <footer>数据由腾讯自选股连接器提供 · 仅供复盘参考，不构成投资建议</footer>`;

      // 手风琴交互
      app.querySelectorAll(".acc-header").forEach(h => h.addEventListener("click", () => {
        h.closest(".module").classList.toggle("open");
      }));
      // 资金簇展开/收起
      app.querySelectorAll(".cluster-head").forEach(h => h.addEventListener("click", () => {
        const c = h.closest(".cluster");
        c.classList.toggle("open");
        h.querySelector(".caret").classList.toggle("open");
      }));
    }
    render();
  </script>
</body>
</html>
